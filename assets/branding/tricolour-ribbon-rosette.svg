<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="topSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="50%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#E67300"/>
    </linearGradient>
    <linearGradient id="topWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="topGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#0E6B05"/>
    </linearGradient>
    <filter id="ribbonGlow" x="-5%" y="-10%" width="110%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Waving Tricolour 3D Ribbon Left to Right -->
  <g filter="url(#ribbonGlow)">
    <!-- Green band -->
    <path d="M15,105 C180,35 360,115 560,75 C680,50 780,95 860,65 L860,95 C780,125 680,80 560,105 C360,145 180,65 15,135 Z" fill="url(#topGreen)"/>
    <!-- White band -->
    <path d="M15,75 C180,5 360,85 560,45 C680,20 780,65 860,35 L860,65 C780,95 680,50 560,75 C360,115 180,35 15,105 Z" fill="url(#topWhite)" stroke="#E2E8F0" stroke-width="0.5"/>
    <!-- Saffron band -->
    <path d="M15,45 C180,-25 360,55 560,15 C680,-10 780,35 860,5 L860,35 C780,65 680,20 560,45 C360,85 180,5 15,75 Z" fill="url(#topSaffron)"/>
  </g>

  <!-- Tricolour Rosette / Medallion on Right (x=890, y=75) -->
  <g transform="translate(890, 75)" filter="url(#ribbonGlow)">
    <!-- Outer Saffron Pleats -->
    <circle r="52" fill="url(#topSaffron)"/>
    <g fill="#FF9933">
      <polygon points="0,-56 7,-48 -7,-48"/>
      <polygon points="39,-39 39,-29 29,-39"/>
      <polygon points="56,0 48,7 48,-7"/>
      <polygon points="39,39 29,39 39,29"/>
      <polygon points="0,56 -7,48 7,48"/>
      <polygon points="-39,39 -39,29 -29,39"/>
      <polygon points="-56,0 -48,-7 -48,7"/>
      <polygon points="-39,-39 -29,-39 -39,-29"/>
      <polygon points="21,-51 26,-42 15,-46"/>
      <polygon points="51,-21 46,-15 42,-26"/>
      <polygon points="51,21 42,26 46,15"/>
      <polygon points="21,51 15,46 26,42"/>
      <polygon points="-21,51 -26,42 -15,46"/>
      <polygon points="-51,21 -46,15 -42,26"/>
      <polygon points="-51,-21 -42,-26 -46,-15"/>
      <polygon points="-21,-51 -15,-46 -26,-42"/>
    </g>
    <!-- Middle White Ring -->
    <circle r="36" fill="url(#topWhite)" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Inner Green Ring -->
    <circle r="22" fill="url(#topGreen)"/>
    <!-- Central Ashoka Chakra -->
    <circle r="12" fill="#FFFFFF" stroke="#000080" stroke-width="1.5"/>
    <circle r="2.5" fill="#000080"/>
    <g stroke="#000080" stroke-width="0.8">
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="-8.5" y1="-8.5" x2="8.5" y2="8.5"/>
      <line x1="-8.5" y1="8.5" x2="8.5" y2="-8.5"/>
      <line x1="-11.1" y1="-4.6" x2="11.1" y2="4.6"/>
      <line x1="-11.1" y1="4.6" x2="11.1" y2="-4.6"/>
      <line x1="-4.6" y1="-11.1" x2="4.6" y2="11.1"/>
      <line x1="-4.6" y1="11.1" x2="4.6" y2="-11.1"/>
    </g>
  </g>
</svg>
