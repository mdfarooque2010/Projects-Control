<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="saudiRosetteDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008744"/>
      <stop offset="50%" stop-color="#006C35"/>
      <stop offset="100%" stop-color="#00431F"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#006C35"/>
      <stop offset="100%" stop-color="#003B1A"/>
    </radialGradient>
  </defs>

  <g filter="url(#saudiRosetteDrop)">
    <!-- Outer Ray Pleats -->
    <circle cx="80" cy="80" r="70" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="1"/>
    <polygon points="143.8,74.9 154.0,80.0 143.8,85.1" fill="#FFD700" opacity="0.95"/>
    <polygon points="142.9,91.6 148.6,98.4 140.3,101.5" fill="#C5A059" opacity="0.95"/>
    <polygon points="137.8,107.5 144.1,117.0 132.7,116.3" fill="#FFD700" opacity="0.95"/>
    <polygon points="128.7,121.5 130.2,130.2 121.5,128.7" fill="#C5A059" opacity="0.95"/>
    <polygon points="116.3,132.7 117.0,144.1 107.5,137.8" fill="#FFD700" opacity="0.95"/>
    <polygon points="101.5,140.3 98.4,148.6 91.6,142.9" fill="#C5A059" opacity="0.95"/>
    <polygon points="85.1,143.8 80.0,154.0 74.9,143.8" fill="#FFD700" opacity="0.95"/>
    <polygon points="68.4,142.9 61.6,148.6 58.5,140.3" fill="#C5A059" opacity="0.95"/>
    <polygon points="52.5,137.8 43.0,144.1 43.7,132.7" fill="#FFD700" opacity="0.95"/>
    <polygon points="38.5,128.7 29.8,130.2 31.3,121.5" fill="#C5A059" opacity="0.95"/>
    <polygon points="27.3,116.3 15.9,117.0 22.2,107.5" fill="#FFD700" opacity="0.95"/>
    <polygon points="19.7,101.5 11.4,98.4 17.1,91.6" fill="#C5A059" opacity="0.95"/>
    <polygon points="16.2,85.1 6.0,80.0 16.2,74.9" fill="#FFD700" opacity="0.95"/>
    <polygon points="17.1,68.4 11.4,61.6 19.7,58.5" fill="#C5A059" opacity="0.95"/>
    <polygon points="22.2,52.5 15.9,43.0 27.3,43.7" fill="#FFD700" opacity="0.95"/>
    <polygon points="31.3,38.5 29.8,29.8 38.5,31.3" fill="#C5A059" opacity="0.95"/>
    <polygon points="43.7,27.3 43.0,15.9 52.5,22.2" fill="#FFD700" opacity="0.95"/>
    <polygon points="58.5,19.7 61.6,11.4 68.4,17.1" fill="#C5A059" opacity="0.95"/>
    <polygon points="74.9,16.2 80.0,6.0 85.1,16.2" fill="#FFD700" opacity="0.95"/>
    <polygon points="91.6,17.1 98.4,11.4 101.5,19.7" fill="#C5A059" opacity="0.95"/>
    <polygon points="107.5,22.2 117.0,15.9 116.3,27.3" fill="#FFD700" opacity="0.95"/>
    <polygon points="121.5,31.3 130.2,29.8 128.7,38.5" fill="#C5A059" opacity="0.95"/>
    <polygon points="132.7,43.7 144.1,43.0 137.8,52.5" fill="#FFD700" opacity="0.95"/>
    <polygon points="140.3,58.5 148.6,61.6 142.9,68.4" fill="#C5A059" opacity="0.95"/>

    <!-- Outer Emerald Rim -->
    <circle cx="80" cy="80" r="63" fill="url(#emeraldGradient)" stroke="#FFD700" stroke-width="1.8"/>
    
    <!-- Gold Beaded Decorative Ring -->
    <circle cx="80" cy="80" r="59" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Circular Gold Band for Text -->
    <circle cx="80" cy="80" r="56" fill="#004D25" stroke="#D4AF37" stroke-width="1.2"/>

    <!-- Circular Arch Path for Text -->
    <path id="textArchTop" d="M 30,80 A 50,50 0 0,1 130,80" fill="none"/>
    <path id="textArchBottom" d="M 130,80 A 50,50 0 0,1 30,80" fill="none"/>

    <text font-family="'IBM Plex Sans', sans-serif" font-size="7.2" font-weight="800" fill="#FFD700" letter-spacing="0.1em">
      <textPath href="#textArchTop" startOffset="50%" text-anchor="middle">
        SAUDI NATIONAL DAY
      </textPath>
    </text>
    <text font-family="'IBM Plex Sans', sans-serif" font-size="6.8" font-weight="800" fill="#FFFFFF" letter-spacing="0.12em">
      <textPath href="#textArchBottom" startOffset="50%" text-anchor="middle">
        ★ 96 YEARS OF PRIDE ★
      </textPath>
    </text>

    <!-- Center Medallion -->
    <circle cx="80" cy="80" r="39" fill="url(#centerGlow)" stroke="url(#goldGradient)" stroke-width="2.2"/>
    <circle cx="80" cy="80" r="36" fill="none" stroke="rgba(255, 215, 0, 0.4)" stroke-width="0.8"/>

    <!-- Saudi Palm Tree & Crossed Swords Emblem + 96 -->
    <!-- Palm Tree (Upper Center) -->
    <g transform="translate(80, 64) scale(0.68)">
      <!-- Palm Trunk -->
      <path d="M-2,14 C-1.5,4 -1,0 0,-8 C1,0 1.5,4 2,14 Z" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="0.5"/>
      <path d="M-4,14 L4,14 L3,16 L-3,16 Z" fill="url(#goldGradient)"/>
      <path d="M-3,10 L3,10 M-2.5,6 L2.5,6 M-2,2 L2,2 M-1.5,-2 L1.5,-2" stroke="#AA771C" stroke-width="0.7"/>

      <!-- Palm Fronds / Branches -->
      <!-- Center top frond -->
      <path d="M0,-8 C-1,-16 0,-24 0,-26 C0,-24 1,-16 0,-8" fill="url(#goldGradient)" stroke="#AA771C" stroke-width="0.5"/>
      <!-- Left fronds -->
      <path d="M0,-8 C-4,-14 -10,-18 -18,-18 C-12,-14 -6,-9 0,-8" fill="url(#goldGradient)"/>
      <path d="M0,-6 C-6,-10 -14,-12 -22,-10 C-15,-8 -8,-5 0,-6" fill="url(#goldGradient)"/>
      <path d="M0,-4 C-6,-6 -14,-6 -20,-2 C-14,-2 -7,-2 0,-4" fill="url(#goldGradient)"/>
      <!-- Right fronds -->
      <path d="M0,-8 C4,-14 10,-18 18,-18 C12,-14 6,-9 0,-8" fill="url(#goldGradient)"/>
      <path d="M0,-6 C6,-10 14,-12 22,-10 C15,-8 8,-5 0,-6" fill="url(#goldGradient)"/>
      <path d="M0,-4 C6,-6 14,-6 20,-2 C14,-2 7,-2 0,-4" fill="url(#goldGradient)"/>
    </g>

    <!-- Crossed Curved Arab Scimitars (Swords) -->
    <g transform="translate(80, 77) scale(0.65)">
      <!-- Sword 1: top-left to bottom-right curve -->
      <path d="M-18,-6 C-10,2 2,10 16,12 C10,9 0,2 -12,-5 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="0.6"/>
      <!-- Sword 1 Hilt -->
      <circle cx="-16" cy="-4" r="1.6" fill="url(#goldGradient)"/>
      <rect x="-19" y="-9" width="3" height="6" rx="1" transform="rotate(-35 -17.5 -6)" fill="url(#goldGradient)"/>

      <!-- Sword 2: top-right to bottom-left curve -->
      <path d="M18,-6 C10,2 -2,10 -16,12 C-10,9 0,2 12,-5 Z" fill="#FFFFFF" stroke="#D4AF37" stroke-width="0.6"/>
      <!-- Sword 2 Hilt -->
      <circle cx="16" cy="-4" r="1.6" fill="url(#goldGradient)"/>
      <rect x="16" y="-9" width="3" height="6" rx="1" transform="rotate(35 17.5 -6)" fill="url(#goldGradient)"/>
    </g>

    <!-- Prominent "96" Badge in Center Lower Medallion -->
    <rect x="63" y="89" width="34" height="17" rx="4" fill="rgba(0, 40, 18, 0.92)" stroke="url(#goldGradient)" stroke-width="1.2"/>
    <text x="80" y="102" font-family="'Space Grotesk', 'IBM Plex Sans', sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.05em">
      96
    </text>
  </g>
</svg>
