<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <filter id="flagShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="flagSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="50%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FF8000"/>
    </linearGradient>
    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E6B05"/>
      <stop offset="50%" stop-color="#138808"/>
      <stop offset="100%" stop-color="#0A5C04"/>
    </linearGradient>
  </defs>

  <g filter="url(#flagShadow)">
    <!-- Flag Outer Border -->
    <rect x="2" y="2" width="296" height="196" rx="6" fill="#FFFFFF" stroke="#000080" stroke-width="2"/>
    
    <!-- Saffron Top Stripe -->
    <path d="M4,4 L296,4 C297,4 298,5 298,6 L298,67 L4,67 L4,6 C4,5 5,4 4,4 Z" fill="url(#flagSaffron)"/>
    
    <!-- White Middle Stripe -->
    <rect x="4" y="67" width="294" height="66" fill="#FFFFFF"/>
    
    <!-- Green Bottom Stripe -->
    <path d="M4,133 L298,133 L298,194 C298,195 297,196 296,196 L4,196 C3,196 2,195 2,194 L2,133 Z" fill="url(#flagGreen)"/>
    
    <!-- 24-Spoke Ashoka Chakra in Center (x=150, y=100, r=26) -->
    <g transform="translate(150, 100)">
      <circle r="26" fill="none" stroke="#000080" stroke-width="2.8"/>
      <circle r="5" fill="#000080"/>
      <!-- 24 Spokes (15 degrees each) -->
      <g stroke="#000080" stroke-width="1.2">
        <line x1="0" y1="-26" x2="0" y2="26"/>
        <line x1="-26" y1="0" x2="26" y2="0"/>
        <line x1="-18.4" y1="-18.4" x2="18.4" y2="18.4"/>
        <line x1="-18.4" y1="18.4" x2="18.4" y2="-18.4"/>
        <line x1="-24.1" y1="-9.9" x2="24.1" y2="9.9"/>
        <line x1="-24.1" y1="9.9" x2="24.1" y2="-9.9"/>
        <line x1="-9.9" y1="-24.1" x2="9.9" y2="24.1"/>
        <line x1="-9.9" y1="24.1" x2="9.9" y2="-24.1"/>
        <line x1="-25.6" y1="-5.1" x2="25.6" y2="5.1"/>
        <line x1="-25.6" y1="5.1" x2="25.6" y2="-5.1"/>
        <line x1="-5.1" y1="-25.6" x2="5.1" y2="25.6"/>
        <line x1="-5.1" y1="25.6" x2="5.1" y2="-25.6"/>
      </g>
    </g>
  </g>
</svg>
